version: '3'

env:
  GOWORK: 'off'

tasks:
  test:
    desc: Test the adapter and native demos
    cmds: [go test ./..., go -C examples test ./...]
  vet:
    desc: Vet the adapter and native demos
    cmds: [go vet ./..., go -C examples vet ./...]
  run-bounce:
    desc: Run the native vector demo
    cmds: [go -C examples run ./bounce]
  run-sprites:
    desc: Run the native sprite demo
    cmds: [go -C examples run ./sprites]
  run-text:
    desc: Run the native text lab
    cmds: [go -C examples run ./text]
  run-shaders:
    desc: Run the native Kage shader lab
    cmds: [go -C examples run ./shaders]
  run-ntui:
    desc: Run the floating ntui shader control panel
    cmds: [go -C examples run ./ntui]
  run-loops:
    desc: Run the event-loop ownership demo
    cmds: [go -C examples run ./loops]
  build-docs:
    desc: Build the Hugo guide into web/docs
    cmds: [sh scripts/build-docs.sh]
  build-wasm-site:
    desc: Build browser demos, the guide, and the pinned booba runtime
    cmds: [sh scripts/build-site.sh]
  check-site:
    desc: Check the generated site and WASM binaries
    cmds:
      - node --check web/site.js
      - node scripts/check-site.mjs
  serve-wasm-site:
    desc: Build and serve http://localhost:8000/web/
    cmds:
      - task: build-wasm-site
      - python3 -m http.server 8000 --bind 127.0.0.1
