# Relative output works under both /web/docs locally and /ntebitengine/docs on Pages.
baseURL = "/"
title = "ntebitengine"
enableGitInfo = false
relativeURLs = true

[module]
  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"

[params]
  description = "Ebitengine framebuffers in Bubble Tea applications"
  BookTheme = "auto"
  BookToC = true
  BookSection = "guide"
  BookRepo = "https://github.com/NimbleTerminal/ntebitengine"
  BookEditPath = "edit/main/docs/hugo"
  # Two chapters are directly reachable in the sidebar. Avoid the theme's
  # root-relative search index so the guide can be served under any prefix.
  BookSearch = false
  BookComments = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]
